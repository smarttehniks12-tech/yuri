<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Небесное ограничение — Что, если ты станешь Тоджи Фусигуро?</title>
<style>
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(fonts/oswald-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url(fonts/oswald-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Oswald'; font-weight: 500; src: url(fonts/oswald-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }
@font-face { font-family: 'Oswald'; font-weight: 500; src: url(fonts/oswald-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url(fonts/montserrat-cyrillic-800-normal.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url(fonts/montserrat-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Montserrat'; font-weight: 600; src: url(fonts/montserrat-cyrillic-600-normal.woff2) format('woff2'); unicode-range: U+0400-045F; }
@font-face { font-family: 'Montserrat'; font-weight: 600; src: url(fonts/montserrat-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
:root { --bg: #050507; --fg: #f1eee8; --acc: #c3122d; --ui: rgba(14,14,18,0.82); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Montserrat, system-ui, sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { display: block; height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; background: #000; }
#start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(195,18,45,0.18), rgba(0,0,0,0.92) 60%); cursor: pointer; z-index: 5; text-align: center; padding: 16px; }
#start h1 { font-family: Oswald, sans-serif; font-weight: 700; letter-spacing: 0.12em; font-size: clamp(28px, 6vw, 72px); margin: 0 0 8px; }
#start p { margin: 0 0 28px; opacity: 0.75; font-weight: 600; font-size: clamp(13px, 2.2vw, 18px); }
#start button { font: 800 clamp(15px, 2.4vw, 20px) Montserrat, sans-serif; color: #fff; background: var(--acc); border: 0; padding: 16px 34px; border-radius: 999px; cursor: pointer; box-shadow: 0 8px 40px rgba(195,18,45,0.45); }
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); display: flex; align-items: center; gap: 10px; opacity: 0; transition: opacity .3s; z-index: 4; }
body.ui #bar, #bar:hover { opacity: 1; }
#bar button { background: var(--ui); color: var(--fg); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; height: 38px; min-width: 38px; padding: 0 12px; font: 700 13px Montserrat, sans-serif; cursor: pointer; }
#bar button.on { background: var(--acc); border-color: var(--acc); }
#seek { flex: 1; accent-color: var(--acc); min-width: 60px; }
#time { font: 600 13px Montserrat, sans-serif; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
@media (max-width: 600px) { #bar { gap: 6px; padding: 8px; } #bar button { padding: 0 8px; } #time { min-width: 0; } .wide { display: none; } }
body.render #bar, body.render #start { display: none !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="start"><div>
  <h1>НЕБЕСНОЕ ОГРАНИЧЕНИЕ</h1>
  <p>Что, если ты станешь Тоджи Фусигуро? · 1:30 · включите звук</p>
  <button id="go">▶ Смотреть</button>
</div></div>
<div id="bar">
  <button id="play" title="Пауза (пробел)">❚❚</button>
  <button id="restart" title="Сначала (R)">↺</button>
  <input id="seek" type="range" min="0" max="90" step="0.01" value="0">
  <span id="time">0:00 / 1:30</span>
  <button id="cc" class="on" title="Субтитры (C)">CC</button>
  <button id="hq" class="wide" title="Motion blur — нужна мощная видеокарта">HQ</button>
  <button id="fs" title="Полный экран (F)">⛶</button>
</div>
<audio id="snd" src="audio/soundtrack.m4a" preload="auto"></audio>
<script src="js/core.js"></script>
<script src="js/shade.js"></script>
<script src="js/timing.js"></script>
<script src="js/hero.js"></script>
<script src="js/face.js"></script>
<script src="js/hands.js"></script>
<script src="js/curse.js"></script>
<script src="js/env.js"></script>
<script src="js/fx.js"></script>
<script src="js/post.js"></script>
<script src="js/director.js"></script>
<script src="js/shots1.js"></script>
<script src="js/shots2.js"></script>
<script src="js/shots3.js"></script>
<script src="js/shots4.js"></script>
<script src="js/player.js"></script>
</body>
</html>
